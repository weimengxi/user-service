# user-service 独立开发环境
version: '3.8'

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      - CONFIG_FILE=/app/configs/config.dev.yaml
      - GIN_MODE=debug
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
    networks:
      - user-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:14-alpine
    container_name: user-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=users
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - user-network

  redis:
    image: redis:7-alpine
    container_name: user-redis
    ports:
      - "6379:6379"
    networks:
      - user-network

volumes:
  postgres_data:

networks:
  user-network:
    driver: bridge
