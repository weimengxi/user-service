# user-service 开发环境（支持热重载）
version: '3.8'

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: user-service-dev
    environment:
      - CONFIG_FILE=/app/configs/config.dev.yaml
      - GIN_MODE=debug
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
    networks:
      - user-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:14-alpine
    container_name: user-postgres-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=users
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - user-network

  redis:
    image: redis:7-alpine
    container_name: user-redis-dev
    ports:
      - "6379:6379"
    networks:
      - user-network

volumes:
  postgres_data:

networks:
  user-network:
    driver: bridge
